[project]
name = "ultron"
version = "0.1.0"
description = "Assistente pessoal com HUD, cérebro Claude Code/Ollama e memória Obsidian"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "mss>=9",
  "Pillow>=10",
  "discord.py>=2.3",
  "psutil>=5.9",
  "httpx>=0.27",
  "pywebview>=5.0; sys_platform == 'win32'",
  "keyboard>=0.13; sys_platform == 'win32'",
  "Windows-Toasts>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ultron*"]

[tool.setuptools.package-data]
ultron = ["hud/*", "ultron.example.toml", "exemplos_iniciais.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
